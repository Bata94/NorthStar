root = "."
tmp_dir = "tmp"

[build]
  cmd = "CGO_ENABLED=0 go build -o /app/northstar ."
  bin = "/app/northstar"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  exclude_regex = [".*_test.go"]
  exclude_unchanged = true
  log = "build-errors.log"
  poll = false
  stop_on_error = false
  send_interrupt = false
  delay = 0

[log]
  main_only = false

[misc]
  clean_on_exit = true
